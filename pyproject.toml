[project]
name = "dcrl"
version = "0.1.0"
description = "An RL environment and task generator for cleaning messy German business tables with pandas."
readme = "README.md"
authors = [{ name = "Aymen Rahmani" }]
requires-python = ">=3.12"
dependencies = [
    "faker>=30",
    "numpy>=1.26",
    # pandas 3 changes copy semantics and the default string dtype; model-written
    # code is mostly pandas-2 style, so the environment stays on 2.x for now.
    "pandas>=2.2,<3",
]

[project.scripts]
dcrl = "dcrl.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcrl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # German and mojibake characters in strings are intended

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
